services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cover-page-app
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-3001}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - MONGODB_URI=${MONGODB_URI}
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium
    shm_size: "512mb"
